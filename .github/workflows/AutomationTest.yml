name: Final Automation Test --> API & Web UI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # Moved to global level

# Prevent duplicate workflows
concurrency:
  group: automation-tests
  cancel-in-progress: true

env:
  JAVA_VERSION: 21
  REPORT_DIR: reports # folder report in gh-pages branch
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true   # Performance test
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # fix warning Node20

jobs:
  # =========================================
  # API & WEB AUTOMATION
  # =========================================
  test:
    name: Run ${{ matrix.test-type }} Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        test-type: [api, web]

    steps:
      # download repository
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # setup java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{env.JAVA_VERSION}}
          distribution: 'temurin'
          cache: gradle   # Cache gradle for speed

      # Performance: cache gradle wrapper
      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # install browser
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2.1.0
        with:
          chrome-version: stable # Explicitly set stable Chrome

      # setup gradlew
      - name: Setup gradlew
        run: chmod +x gradlew

      # Execute the Gradle command for running tests
      - name: Execute Test Suite
        run: |
          if [ "${{ matrix.test-type }}" = "api" ]; then
            ./gradlew runApiTest --parallel --build-cache --info --stacktrace
          else
            ./gradlew runWebTest --parallel --build-cache --info --stacktrace
          fi

      # Debug report folder to ensure report file exist
      - name: Debug Reports
        if: always()
        run: |
          echo "=== REPORT STRUCTURE ==="
          ls -R build || true

      # Upload API & Web Report
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.test-type }}
          path: |
            build/reports
            build/allure-results
          if-no-files-found: warn

  # =========================================
  # DEPLOY TO GITHUB PAGES
  # =========================================
  deploy-report:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      # Mandatory for workspace repo to be available
      - name: Checkout Repository
        uses: actions/checkout@v4

     # Download artifacts
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts   # all artifacts go into this folder

      # Debug to know the structure of the artifact
      - name: Debug Artifact Structure
        run: |
          echo "=== ARTIFACT STRUCTURE ==="
          ls -R artifacts

      # Install Allure CLI manually (compatible with Ubuntu 24.04)
      - name: Install Allure
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxvf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure
          allure --version

      # Generate allure report from results
      - name: Generate Allure Reports
        run: |
          mkdir -p reports/allure-api
          mkdir -p reports/allure-web
          
          allure generate artifacts/report-api/allure-results -o reports/allure-api --clean || true
          allure generate artifacts/report-web/allure-results -o reports/allure-web --clean || true

      - name: Show Allure Report Structure
        run: ls -R reports

     # Folder structure (copy cucumber report + allure reports to $REPORT_DIR)
      - name: Prepare Folder Structure
        run: |
          mkdir -p $REPORT_DIR/api
          mkdir -p $REPORT_DIR/web
          mkdir -p $REPORT_DIR/allure-api
          mkdir -p $REPORT_DIR/allure-web       
          
          # Copy cucumber report
          cp artifacts/report-api/reports/cucumber/api_test_report.html $REPORT_DIR/api/ || true
          cp artifacts/report-web/reports/cucumber/web_test_report.html $REPORT_DIR/web/ || true
          
          # Copy allure report
          cp -r reports/allure-api/* $REPORT_DIR/allure-api/ || true
          cp -r reports/allure-web/* $REPORT_DIR/allure-web/ || true

      # Debug final folder
      - name: Debug Final Pages Structure
        run: |
          echo "=== FINAL REPORT STRUCTURE ==="
          ls -R $REPORT_DIR

  # Create GitHub Pages dashboard
      - name: Create Dashboard index.html
        run: |
          cat <<EOF > $REPORT_DIR/index.html
          <html>
          <head>
              <title>Automation Test Dashboard</title>
              <style>
                  body { font-family: Arial; text-align:center; }
                  a { display:block; margin:10px; font-size:20px; }
              </style>
          </head>
          <body>

              <h1>Automation Test Dashboard</h1>

              <h2>API Test</h2>
              <a href="api/api_test_report.html">Cucumber API Report</a>
              <a href="allure-api/index.html">Allure API Report</a>

              <h2>Web UI Test</h2>
              <a href="web/web_test_report.html">Cucumber Web Report</a>
              <a href="allure-web/index.html">Allure Web Report</a>

          </body>
          </html>
          EOF

     # Deploy to GitHub Pages
      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN}}
          publish_dir: ${{ env.REPORT_DIR }}
          publish_branch: gh-pages   # Explicit branch
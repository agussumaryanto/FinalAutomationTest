name: Final Automation Test --> API & Web UI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # Moved to global level

env:
  JAVA_VERSION: 21
  REPORT_DIR: reports # folder report in gh-pages branch
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true   # Performance test

jobs:
  # =========================================
  # API & WEB AUTOMATION
  # =========================================
  test:
    name: Run ${{ matrix.test-type }} Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        test-type: [api, web]

    steps:
      # download repository
      - uses: actions/checkout@v4

      # setup java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{env.JAVA_VERSION}}
          distribution: 'temurin'
          cache: gradle   # Cache gradle for speed

      # Performance: cache gradle wrapper
      - name: Cache Gradle Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # install browser
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2.1.0
        with:
          chrome-version: stable # Explicitly set stable Chrome

      # Set Chrome options for Headless Web UI
      - name: Set Chrome options for Headless
        if: matrix.test-type == 'web'
        run: |
          export CHROME_OPTS="--headless --no-sandbox --disable-dev-shm-usage"

      # setup gradlew
      - name: Setup gradlew
        run: chmod +x gradlew

      # Execute the Gradle command for running tests
      - name: Execute Test Suite
        run: |
          if [ "${{ matrix.test-type }}" = "api" ]; then
            ./gradlew runApiTest --parallel --build-cache --info
          else
            ./gradlew runWebTest --parallel --build-cache --info
          fi

      # Debug report folder to ensure report file exist
      - name: Debug Reports
        if: always()
        run: |
          echo "=== REPORT STRUCTURE ==="
          ls -R build || true

      # Generate Allure report per test type
      - name: Generate Allure Report
        if: always()
        run: |
          ./gradlew allureReport \
            -Pallure.results.directory=build/allure-results/${{ matrix.test-type }} \
            -Pallure.report.directory=build/reports/allure/${{ matrix.test-type }}

      # Upload API & Web Report
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.test-type }}
          path: |
            build/reports/cucumber/${{ matrix.test-type }}*_report.*   # HTML + JSON
            build/allure-results/${{ matrix.test-type }}               # Allure results folder
          if-no-files-found: warn

  # =========================================
  # DEPLOY TO GITHUB PAGES
  # =========================================
  deploy-report:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      # Mandatory for workspace repo to be available
      - name: Checkout Repository
        uses: actions/checkout@v4

     # Download artifacts
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts   # all artifacts go into this folder

      # Debug to know the structure of the artifact
      - name: Debug Artifact Structure
        run: |
          echo "=== ARTIFACT STRUCTURE ==="
          ls -R artifacts

      # Install Allure CLI manually (compatible with Ubuntu 24.04)
      - name: Install Allure
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz
          tar -zxvf allure-2.27.0.tgz
          sudo mv allure-2.27.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/bin/allure
          allure --version

      # Generate allure report from results
      - name: Generate Allure Reports
        run: |
          mkdir -p reports/allure-api
          mkdir -p reports/allure-web
          
          allure generate artifacts/report-api/allure-results -o reports/allure-api --clean || true
          allure generate artifacts/report-web/allure-results -o reports/allure-web --clean || true

      - name: Show Allure Report Structure
        run: ls -R reports

     # Folder structure (copy only cucumber report
      - name: Prepare Folder Structure
        run: |
          mkdir -p $REPORT_DIR/api
          mkdir -p $REPORT_DIR/web
          
          if [ -d "artifacts/report-api/cucumber" ]; then
            cp -r artifacts/report-api/cucumber/* $REPORT_DIR/api/ || true
          fi
          if [ -d "artifacts/report-web/cucumber" ]; then
            cp -r artifacts/report-web/cucumber/* $REPORT_DIR/web/ || true
          fi

     # Deploy to GitHub Pages
      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN}}
          publish_dir: ${{ env.REPORT_DIR }}
          publish_branch: gh-pages   # Explicit branch
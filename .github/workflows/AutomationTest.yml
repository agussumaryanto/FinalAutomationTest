name: Final Automation Test --> API & Web UI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # Moved to global level

env:
  JAVA_VERSION: 21
  REPORT_DIR: reports # folder report in gh-pages branch

jobs:
  # =========================================
  # API & WEB AUTOMATION
  # =========================================
  test:
    name: Run ${{ matrix.test-type }} Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        test-type: [api, web]

    steps:
      # download repository
      - uses: actions/checkout@v4

      # setup java
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: ${{env.JAVA_VERSION}}
          distribution: 'temurin'
          cache: gradle   # Cache gradle for speed

      # install browser
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v2.1.0
        with:
          chrome-version: stable # Explicitly set stable Chrome

      # Set Chrome options for Headless Web UI
      - name: Set Chrome options for Headless
        if: matrix.test-type == 'web'
        run: |
          export CHROME_OPTS="--headless --no-sandbox --disable-dev-shm-usage"

      # setup gradlew
      - name: Setup gradlew
        run: chmod +x gradlew

      # Execute the Gradle command for running tests
      - name: Execute Test Suite
        run: |
          if [ "${{ matrix.test-type }}" = "api" ]; then
            ./gradlew clean runApiTest --info --stacktrace
          else
            ./gradlew clean runWebTest --info --stacktrace
          fi

      # Generate Allure report per test type
      - name: Generate Allure Report
        if: always()
        run: |
          ./gradlew allureReport \
            -Pallure.results.directory=build/allure-results/${{ matrix.test-type }} \
            -Pallure.report.directory=build/reports/allure/${{ matrix.test-type }}

      # Upload API & Web Report
      - name: Upload API Reports
        if: matrix.test-type == 'api'
        uses: actions/upload-artifact@v4
        with:
          name: report-api
          path: |
           build/reports/cucumber/api_test_report.html
           build/reports/cucumber/api_test_report.json
           build/reports/allure/api
          if-no-files-found: warn

      - name: Upload Web Reports
        if: matrix.test-type == 'web'
        uses: actions/upload-artifact@v4
        with:
          name: report-web
          path: |
            build/reports/cucumber/webUi_test_report.html
            build/reports/cucumber/webUi_test_report.json
            build/reports/allure/web

  # =========================================
  # DEPLOY TO GITHUB PAGES
  # =========================================
  deploy-report:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      # Mandatory for workspace repo to be available
      - name: Checkout Repository
        uses: actions/checkout@v4

     # Download artifacts
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts   # all artifacts go into this folder

      # Debug to know the structure of the artifact
      - name: Debug Artifact Structure
        run: |
          echo "=== ARTIFACT STRUCTURE ==="
          ls -R artifacts

     # Folder structure
      - name: Prepare Folder Structure
        run: |
          mkdir -p $REPORT_DIR/api
          mkdir -p $REPORT_DIR/web
          mkdir -p $REPORT_DIR/allure-api
          mkdir -p $REPORT_DIR/allure-web
          
          # copy cucumber report
          cp -r artifacts/report-api/* $REPORT_DIR/api/ || true
          cp -r artifacts/report-web/* $REPORT_DIR/web/ || true
          
          # copy allure report including the folder contents 
          cp -r artifacts/report-api/allure/* $REPORT_DIR/allure-api/ || true
          cp -r artifacts/report-web/allure/* $REPORT_DIR/allure-web/ || true

     # Deploy to GitHub Pages
      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN}}
          publish_dir: ${{ env.REPORT_DIR }}
          publish_branch: gh-pages   # Explicit branch
